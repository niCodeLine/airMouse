[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airmouse"
version = "2.0.0"
description = "Control macOS with deliberate, camera-tracked hand gestures."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nico Spok" }]
requires-python = ">=3.10,<3.13"
keywords = ["computer-vision", "gestures", "mediapipe", "accessibility", "macos"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
]

[project.scripts]
airmouse = "airmouse.cli:main"

[project.optional-dependencies]
runtime = [
  "mediapipe>=0.10.18,<0.11",
  "opencv-python>=4.10,<5",
  "pyautogui>=0.9.54,<1",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/niCodeLine/airmouse"
Issues = "https://github.com/niCodeLine/airmouse/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/airmouse"]

[tool.pytest.ini_options]
addopts = "--cov=airmouse --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
